[package]
name = "lintra-runtime-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately independent from the production core/CLI/Slint workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_os = "windows")'.dependencies]
# Already pinned transitive Wry dependencies. Direct access is needed because
# NavigationStarting can reject display after WebView2 has begun an HTTP load.
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }

[profile.dev]
debug = 0
incremental = false

[profile.release]
strip = true
