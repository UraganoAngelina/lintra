name: Desktop adapter

on:
  push:
    branches: [work/p1-foundations]
    paths:
      - apps/lintra-desktop/**
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows desktop build (not Windows 11 qualification)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
        working-directory: apps/lintra-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: apps/lintra-desktop/package-lock.json
      # Official GitHub action; reviewed action.yml/README at this immutable ref.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            apps/lintra-desktop/src-tauri/target
          key: Windows-desktop-rust1991-msvc-${{ hashFiles('apps/lintra-desktop/src-tauri/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: Windows-desktop-rust1991-msvc-
      - name: Install locked frontend, lint, test and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Locked frontend installation failed' }
          npm run lint
          if ($LASTEXITCODE -ne 0) { throw 'Frontend static lint failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Frontend contract tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Strict frontend build failed' }
      - name: Check native Rust boundaries
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Rust formatting failed' }
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --target x86_64-pc-windows-msvc --features tauri/custom-protocol -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Native boundary tests failed' }
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --release --all-targets --target x86_64-pc-windows-msvc --features tauri/custom-protocol -j 2 -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Desktop Clippy failed' }
      - name: Build the separate desktop binary
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --target x86_64-pc-windows-msvc --features tauri/custom-protocol -j 2
          if ($LASTEXITCODE -ne 0) { throw 'Desktop build failed' }
      - name: Smoke native React and raw IPC on Windows Server
        run: |
          python tests/native_smoke.py src-tauri/target/x86_64-pc-windows-msvc/release/lintra-desktop.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native React and IPC smoke failed' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lintra-desktop-windows-${{ github.sha }}
          path: apps/lintra-desktop/src-tauri/target/x86_64-pc-windows-msvc/release/lintra-desktop.exe
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux desktop build and X11 smoke (not CachyOS qualification)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: apps/lintra-desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.13.0'
          cache: npm
          cache-dependency-path: apps/lintra-desktop/package-lock.json
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            apps/lintra-desktop/src-tauri/target
          key: Linux-desktop-rust1991-${{ hashFiles('apps/lintra-desktop/src-tauri/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: Linux-desktop-rust1991-
      - name: Install native WebView and virtual display prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev xvfb xauth
      - name: Install locked frontend, lint, test and build
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: Check and build isolated native adapter
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --locked --release --target x86_64-unknown-linux-gnu --features tauri/custom-protocol -j 2
          cargo clippy --manifest-path src-tauri/Cargo.toml --locked --release --all-targets --target x86_64-unknown-linux-gnu --features tauri/custom-protocol -j 2 -- -D warnings
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --target x86_64-unknown-linux-gnu --features tauri/custom-protocol -j 2
      - name: Smoke native React and raw IPC in Xvfb
        env:
          GDK_BACKEND: x11
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python3 tests/native_smoke.py src-tauri/target/x86_64-unknown-linux-gnu/release/lintra-desktop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lintra-desktop-linux-${{ github.sha }}
          path: apps/lintra-desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/lintra-desktop
          if-no-files-found: error
          retention-days: 7
