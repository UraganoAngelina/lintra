name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: lintra
            msvc_rustflags: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: lintra.exe
            msvc_rustflags: '-C target-feature=+crt-static'
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.msvc_rustflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test release tooling without credentials
        run: python -m unittest discover -s scripts/tests -v
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native target
        run: rustup target add ${{ matrix.target }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Test
        run: cargo test --target ${{ matrix.target }} --locked
      - name: Clippy all features
        run: cargo clippy --all-targets --all-features --target ${{ matrix.target }} --locked -- -D warnings
      - name: Test all features
        run: cargo test --all-features --target ${{ matrix.target }} --locked
      - name: Check tooling formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - name: Clippy tooling
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test tooling and extracted data bundle
        env:
          LINTRA_TEST_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/debug/${{ matrix.binary }}
        run: cargo test --manifest-path xtask/Cargo.toml --locked -- --include-ignored
      - name: Build reproducible release and verify artifact
        run: cargo xtask build-release --target ${{ matrix.target }} --verify-reproducible --verify-artifact
