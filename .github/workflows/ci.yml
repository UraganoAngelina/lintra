name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ui_packaging:
        description: Qualify native UI release archives too
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Workspace now includes the separately compiled Slint desktop adapter.
    # Full CAD83/history tests plus both reproducible release builds must leave
    # time for the final native bundle/JSONL probes (35m expired on Windows).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: lintra
            msvc_rustflags: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            binary: lintra.exe
            msvc_rustflags: '-C target-feature=+crt-static'
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.msvc_rustflags }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare controlled Windows test deployment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # This job owns its disposable checkout and temporary directory.
          # Reference integrity tests require controlled mutation permissions,
          # as does a deployed per-account dictionary. Never alter a developer's
          # checkout or the runner user's shared/global temporary directory.
          $currentSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $fixtureTemp = Join-Path $env:RUNNER_TEMP 'lintra-controlled-tests'
          New-Item -ItemType Directory -Path $fixtureTemp -Force | Out-Null
          foreach ($ownedRoot in @($env:GITHUB_WORKSPACE, $fixtureTemp)) {
            # Inheritable ACEs belong on directories. Applying those flags to
            # every file after removing its inheritance can leave the file
            # unreadable. Protect the root, then restore descendant inheritance.
            $security = [Security.AccessControl.DirectorySecurity]::new()
            $security.SetAccessRuleProtection($true, $false)
            $inherit = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor [Security.AccessControl.InheritanceFlags]::ObjectInherit
            foreach ($sid in @($currentSid, 'S-1-5-18', 'S-1-5-32-544')) {
              $identity = [Security.Principal.SecurityIdentifier]::new($sid)
              $rule = [Security.AccessControl.FileSystemAccessRule]::new($identity, [Security.AccessControl.FileSystemRights]::FullControl, $inherit, [Security.AccessControl.PropagationFlags]::None, [Security.AccessControl.AccessControlType]::Allow)
              $security.AddAccessRule($rule)
            }
            Set-Acl -LiteralPath $ownedRoot -AclObject $security
            if (Get-ChildItem -LiteralPath $ownedRoot -Force | Select-Object -First 1) {
              icacls (Join-Path $ownedRoot '*') /reset /T /Q
              if ($LASTEXITCODE -ne 0) { throw 'Cannot restore controlled descendant inheritance' }
            }
          }
          Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'scripts/tests/test_workspace.py') -TotalCount 1 | Out-Null
          $probe = Join-Path $fixtureTemp 'permission-probe.txt'
          [IO.File]::WriteAllText($probe, 'synthetic-readable-writable')
          if ([IO.File]::ReadAllText($probe) -ne 'synthetic-readable-writable') { throw 'Test permissions are ineffective' }
          Remove-Item -LiteralPath $probe
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$fixtureTemp" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$fixtureTemp" -Encoding utf8
      - name: Prepare synthetic loopback SMB export destinations
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Disposable native CI fixture only. The product starts no SMB server
          # and receives no new networking dependency or general share access.
          Start-Service LanmanServer
          $share = 'lintra_export_' + $env:GITHUB_RUN_ID + '_' + $env:GITHUB_RUN_ATTEMPT
          $directory = Join-Path $env:TEMP $share
          New-Item -ItemType Directory -Path $directory -ErrorAction Stop | Out-Null
          $principal = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          New-SmbShare -Name $share -Path $directory -FullAccess $principal | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LINTRA_TEST_EXPORT_SHARE=$share" -Encoding utf8
          $unc = '\\localhost\' + $share
          if (!(Test-Path -LiteralPath $unc)) { throw 'Synthetic loopback share unavailable' }
          $used = [IO.DriveInfo]::GetDrives().Name
          $drive = 90..82 | ForEach-Object { ([char]$_).ToString() + ':' } | Where-Object { ($_.ToString() + '\') -notin $used } | Select-Object -First 1
          if (!$drive) { throw 'No unused drive for the synthetic mapping' }
          New-SmbMapping -LocalPath $drive -RemotePath $unc -Persistent $false | Out-Null
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LINTRA_TEST_EXPORT_DRIVE=$drive" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LINTRA_TEST_EXPORT_UNC=$unc" -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "LINTRA_TEST_EXPORT_MAPPED=$drive\" -Encoding utf8
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Test release tooling without credentials
        run: python -m unittest discover -s scripts/tests -v
      - name: Install Linux desktop build prerequisite
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          # Use official Ubuntu HTTPS archives after the image's Azure mirror
          # failed DNS. Preserve suites, Signed-By and all apt/TLS verification.
          sudo python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'mirror+file:/etc/apt/apt-mirrors.txt': 'https://archive.ubuntu.com/ubuntu',
              'mirror+file:/etc/apt/apt-security-mirrors.txt': 'https://security.ubuntu.com/ubuntu',
              'http://azure.archive.ubuntu.com/ubuntu': 'https://archive.ubuntu.com/ubuntu',
              'https://azure.archive.ubuntu.com/ubuntu': 'https://archive.ubuntu.com/ubuntu',
          }
          sources = Path('/etc/apt/sources.list.d')
          for path in [Path('/etc/apt/sources.list'), *sources.glob('*.sources'), *sources.glob('*.list')]:
              if not path.is_file():
                  continue
              original = path.read_text()
              updated = original
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != original:
                  path.write_text(updated)
                  print('Selected official Ubuntu archive in', path.name)
          PY
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 -o APT::Update::Error-Mode=any update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::https::Timeout=30 install --no-install-recommends --yes libfontconfig1-dev
          pkg-config --modversion fontconfig
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native target
        run: rustup target add ${{ matrix.target }}
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --target ${{ matrix.target }} --locked
      - name: Clippy all features
        run: cargo clippy --workspace --all-targets --all-features --target ${{ matrix.target }} --locked -- -D warnings
      - name: Test all features
        run: cargo test --workspace --all-features --target ${{ matrix.target }} --locked
      - name: Qualify actual Windows shared export consent and canonical files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test -p lintra --all-features --target ${{ matrix.target }} --locked --test shared_export_cli -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Actual CLI shared export qualification failed' }
          cargo test -p lintra-ui --all-features --target ${{ matrix.target }} --locked --test shared_exports -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Actual UI shared export qualification failed' }
      - name: Qualify actual Linux directory-sync failure after publication
        if: runner.os == 'Linux'
        run: cargo test -p lintra-ui --all-features --target ${{ matrix.target }} --locked --test exports directory_sync_failure_after_rename_reports_the_published_file -- --exact --ignored
      - name: Remove only this job's synthetic SMB fixture
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:LINTRA_TEST_EXPORT_DRIVE -match '^[R-Z]:$') {
            Remove-SmbMapping -LocalPath $env:LINTRA_TEST_EXPORT_DRIVE -Force -ErrorAction Stop
          }
          if ($env:LINTRA_TEST_EXPORT_SHARE -match '^lintra_export_[0-9]+_[0-9]+$') {
            Remove-SmbShare -Name $env:LINTRA_TEST_EXPORT_SHARE -Force -Confirm:$false
          }
      # UI's embedded feature is additive. Verify the independent core build
      # too: workspace feature unification must not hide a no-bundle regression.
      - name: Test core without embedded bundle
        run: cargo test -p lintra --no-default-features --target ${{ matrix.target }} --locked
      - name: Verify workspace and core dependency boundary
        run: python scripts/check_workspace.py
      - name: Verify actual build rejects missing embedded font
        env:
          LINTRA_FONT_CHECK_TARGET: ${{ matrix.target }}
        run: python ui/check_missing_font.py
      - name: Upload native desktop pixels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-pixels-${{ matrix.target }}
          path: target/ui-bootstrap-visual/*.rgb
          if-no-files-found: error
          retention-days: 7
      - name: Upload production visual regression pixels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-pixels-${{ matrix.target }}
          path: target/ui-regression/*.rgb
          if-no-files-found: error
          retention-days: 7
      - name: Upload desktop captures and contrast evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bootstrap-evidence-${{ matrix.target }}
          path: |
            target/ui-bootstrap-visual/*.png
            target/ui-bootstrap-visual/contrast.tsv
            target/ui-worker-visual/*.png
            target/ui-results-visual/*.png
            target/ui-results-visual/scrolling.json
            target/ui-exports/*.png
            target/ui-regression/*.png
            target/ui-signature/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Smoke synthetic benchmark and verify expected validation counts
        run: cargo test --bench validation --target ${{ matrix.target }} --locked -- --output target/benchmark-smoke.json --smoke
      - name: Smoke the real SQLite adapter with indexed lookups and process restart
        run: cargo test --bench persistence --target ${{ matrix.target }} --locked -- --output target/sqlite-smoke.json --smoke
      - name: Qualify synthetic five-trace memory and SQLite profiles
        run: cargo test --bench persistence_profiles --target ${{ matrix.target }} --locked -- --output target/persistence-profiles-smoke.json --smoke
      - name: Upload synthetic persistence profile measurements
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: persistence-profiles-${{ matrix.target }}
          path: target/persistence-profiles-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Export a closed synthetic SQLite database for the opposite OS
        env:
          LINTRA_SQLITE_EXPORT_DIR: ${{ github.workspace }}/target/persistence-transfer
        run: cargo test -p lintra --lib --target ${{ matrix.target }} --locked persistence::sqlite::tests::qualification::export_native_snapshot_fixture -- --exact --ignored
      - name: Upload the synthetic database and transport manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-portability-${{ matrix.target }}
          path: target/persistence-transfer/*
          if-no-files-found: error
          retention-days: 7
      - name: Check tooling formatting
        run: cargo fmt --manifest-path xtask/Cargo.toml -- --check
      - name: Clippy tooling
        run: cargo clippy --manifest-path xtask/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test tooling and extracted data bundle
        env:
          LINTRA_TEST_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/debug/${{ matrix.binary }}
        run: cargo test --manifest-path xtask/Cargo.toml --locked -- --include-ignored
      - name: Build reproducible release and verify artifact
        shell: bash
        run: |
          set -o pipefail
          cargo xtask build-release --target ${{ matrix.target }} --verify-reproducible --verify-artifact | tee target/native-release.log
      - name: Execute README quickstart in native shell from a fresh install
        run: python scripts/readme_smoke.py --build-log target/native-release.log --output target/readme-smoke.json
      - name: Upload native README acceptance evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-smoke-${{ matrix.target }}
          path: target/readme-smoke.json
          if-no-files-found: error
          retention-days: 7
      - name: Package synthetic data for native bundle probe
        shell: bash
        run: |
          mkdir target/cross-os-bundle
          cargo xtask bundle-data --input bundles/embedded --output-dir target/cross-os-bundle
      - name: Exercise native release and executable-relative bundle resolution
        run: python tests/packaging_probe.py produce --build-log target/native-release.log --bundle target/cross-os-bundle/schemas-synthetic-embedded-v1.zip --output target/cross-os-jsonl
      - name: Upload raw JSONL from native runner
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jsonl-${{ matrix.target }}
          path: target/cross-os-jsonl/*.jsonl
          if-no-files-found: error
          retention-days: 7

  cross-os-snapshots:
    name: Reopen counterpart snapshot (${{ matrix.target }})
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            peer_target: x86_64-pc-windows-msvc
            peer_os: windows
            msvc_rustflags: ''
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            peer_target: x86_64-unknown-linux-gnu
            peer_os: linux
            msvc_rustflags: '-C target-feature=+crt-static'
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.msvc_rustflags }}
      LINTRA_SQLITE_IMPORT_DIR: ${{ github.workspace }}/target/persistence-counterpart
      LINTRA_SQLITE_EXPECTED_ORIGIN: ${{ matrix.peer_os }}
      LINTRA_SQLITE_IMPORT_RESULT: ${{ github.workspace }}/target/persistence-import-result.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snapshot-portability-${{ matrix.peer_target }}
          path: target/persistence-counterpart
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native target
        run: rustup target add ${{ matrix.target }}
      - name: Reopen and authenticate the database produced by the opposite OS
        run: cargo test -p lintra --lib --target ${{ matrix.target }} --locked persistence::sqlite::tests::qualification::import_opposite_native_snapshot_fixture -- --exact --ignored
      - name: Upload native cross-OS snapshot evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-import-${{ matrix.target }}
          path: target/persistence-import-result.json
          if-no-files-found: error
          retention-days: 7

  compare-ui-pixels:
    name: Compare native desktop theme pixels
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-pixels-x86_64-unknown-linux-gnu
          path: target/bootstrap-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bootstrap-pixels-x86_64-pc-windows-msvc
          path: target/bootstrap-windows
      - name: Compare both themes at 1x and 2x without tolerance
        run: python ui/compare_pixels.py --left target/bootstrap-linux --right target/bootstrap-windows

  compare-ui-regression:
    name: Compare production UI regression pixels
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regression-pixels-x86_64-unknown-linux-gnu
          path: target/regression-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regression-pixels-x86_64-pc-windows-msvc
          path: target/regression-windows
      - name: Compare actual production pixels in both themes and scales
        run: python ui/compare_pixels.py --left target/regression-linux --right target/regression-windows

  compare-jsonl:
    name: Compare Linux and Windows JSONL bytes
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jsonl-x86_64-unknown-linux-gnu
          path: target/jsonl-linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jsonl-x86_64-pc-windows-msvc
          path: target/jsonl-windows
      - name: Compare exact inventory, UTF-8 LF and unmodified bytes
        run: python tests/packaging_probe.py compare --left target/jsonl-linux --right target/jsonl-windows

  ui-native-package:
    name: Qualify UI archives
    if: github.event_name == 'workflow_dispatch' && inputs.ui_packaging
    uses: ./.github/workflows/ui-package.yml
