[workspace]
members = [".", "ui"]
# Preserve the existing CLI build/release commands; CI checks all members explicitly.
default-members = ["."]
exclude = ["xtask", "spikes/ui-prototype"]
resolver = "3"

[package]
name = "lintra"
version = "0.1.1-rc.1"
edition = "2024"
description = "Configurable, versioned validation engine for fixed-width healthcare flows"
publish = false

[features]
default = []
embedded-bundle = []

[lib]
path = "src/lib.rs"

[[bin]]
name = "lintra"
path = "src/main.rs"

[[bench]]
name = "validation"
harness = false

[dependencies]
ctrlc = { version = "=3.5.2", default-features = false }
clap = { version = "=4.6.7", default-features = false, features = ["std", "help", "usage", "error-context"] }
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.13.0", default-features = false, features = ["zeroize"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }

rust_xlsxwriter = { version = "=0.100.0", default-features = false, features = ["constant_memory"] }

# Secure RAII spool for post-analysis XLSX when JSONL is not requested.
# Same pinned package already qualified in the XLSX backend subtree.
tempfile = { version = "=3.27.0", default-features = false }

# Offline schema tooling only; same version qualified in T-P12-05.
calamine = { version = "=0.36.1", default-features = false }

[dev-dependencies]
# Read the actual XLSX ZIP/XML in the backend probe; same pure-Rust backend.
zip = { version = "=9.0.5", default-features = false, features = ["deflate"] }

# T-P15-01: controlled release optimization; performance qualification is P17.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
