[package]
name = "lintra"
version = "0.1.0"
edition = "2024"
description = "Configurable, versioned validation engine for fixed-width healthcare flows"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "lintra"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
