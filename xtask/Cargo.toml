[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
goblin = { version = "=0.10.7", default-features = false, features = ["std", "elf32", "elf64", "pe32", "pe64", "endian_fd"] }

lintra = { path = "..", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
zip = { version = "=9.0.5", default-features = false }
tempfile = { version = "=3.27.0", default-features = false }

[dev-dependencies]
serde_json = { version = "=1.0.151", features = ["arbitrary_precision"] }

# Standalone build tooling; the product remains the current single package.
[workspace]
