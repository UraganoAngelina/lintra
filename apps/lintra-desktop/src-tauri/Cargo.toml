[package]
name = "lintra-desktop"
version = "0.1.1-rc.3"
edition = "2024"
publish = false

# Independent adapter: root Cargo.lock, default CLI and Slint stay unchanged.
[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
lintra = { path = "../../..", default-features = false, features = ["embedded-bundle"] }
getrandom = "=0.4.3"
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "3.27.0"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"

[dev-dependencies]
tempfile = { version = "=3.27.0", default-features = false }

[profile.dev]
debug = 0

[profile.release]
strip = true
